<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เป็นแฟนกันนะ 💖</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Kanit & Quicksand) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kanit', 'Quicksand', sans-serif;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-100px) rotate(15deg); opacity: 0.8; }
            100% { transform: translateY(-200px) rotate(-15deg); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(244, 63, 94, 0.4); }
            50% { box-shadow: 0 0 45px rgba(244, 63, 94, 0.7); }
        }
        .glow-card {
            animation: pulseGlow 3s infinite;
        }
        /* Custom custom scrollbar for settings modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 63, 94, 0.4);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-rose-100 to-red-200 min-h-screen flex items-center justify-center overflow-hidden relative p-4">

    <!-- Background Floating Hearts Container -->
    <div id="bg-hearts" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Edit/Settings Trigger Button -->
    <button onclick="toggleSettingsModal()" class="fixed top-4 right-4 bg-white/80 hover:bg-white text-rose-600 p-3 rounded-full shadow-lg backdrop-blur-md z-40 transition-all hover:scale-110 active:scale-95 flex items-center gap-2 font-medium text-sm border border-rose-200" title="ปรับแต่งข้อความและรูปภาพ">
        <span class="text-lg" aria-hidden="true">✏️</span>
        <span class="hidden sm:inline">ปรับแต่งการ์ด</span>
    </button>

    <!-- Main Card Container -->
    <div id="main-card" class="glow-card backdrop-blur-xl bg-white/70 border border-white/90 shadow-2xl rounded-3xl p-8 max-w-md w-full text-center relative z-10 transition-all duration-500">
        
        <!-- Sticker / Image Container -->
        <div class="mb-6 relative">
            <div id="sticker-container" class="w-36 h-36 mx-auto bg-pink-100/90 rounded-full flex items-center justify-center shadow-inner relative overflow-hidden animate-bounce border-4 border-white">
                <span id="display-emoji" class="text-7xl select-none">🧸</span>
                <img id="display-image" src="" alt="Custom" class="w-full h-full object-cover hidden">
                <div class="absolute -top-1 -right-1 text-3xl animate-ping select-none">💖</div>
            </div>
        </div>

        <!-- Question Title & Subtitle -->
        <h1 id="display-title" class="text-3xl sm:text-4xl font-bold text-slate-800 mb-3 tracking-wide drop-shadow-sm">
            เป็นแฟนกันนะ? 💘
        </h1>
        <p id="display-subtitle" class="text-slate-600 mb-8 text-base sm:text-lg leading-relaxed">
            เธอทำให้หัวใจของฉันเต้นแรงทุกวันเลยนะ... 🥰
        </p>
        <p id="display-message" class="hidden whitespace-pre-line text-slate-600 mb-8 -mt-4 text-sm sm:text-base leading-relaxed bg-white/60 rounded-2xl p-3 border border-pink-100"></p>

        <!-- Action Buttons Container -->
        <div id="button-container" class="flex flex-col sm:flex-row items-center justify-center gap-4 relative min-h-[70px]">
            <!-- Yes Button -->
            <button id="yes-btn" onclick="handleYesClick()" class="w-full sm:w-auto bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold text-lg py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 cursor-pointer z-20">
                ตกลงค่ะ! 💖
            </button>

            <!-- No Button -->
            <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton(); event.preventDefault();" class="w-full sm:w-auto bg-white/80 hover:bg-white text-slate-600 font-semibold text-lg py-3 px-6 rounded-full shadow-md border border-slate-200 transition-all duration-150 cursor-pointer z-10">
                ไม่เอาอ่ะ 😢
            </button>
        </div>
    </div>

    <!-- Celebration Screen (Initially Hidden) -->
    <div id="celebration-screen" class="hidden backdrop-blur-xl bg-white/80 border border-white/90 shadow-2xl rounded-3xl p-8 max-w-md w-full max-h-[92vh] overflow-y-auto text-center relative z-10 transition-all duration-500 transform scale-95 opacity-0">
        <div class="w-36 h-36 mx-auto bg-pink-200/90 rounded-full flex items-center justify-center shadow-inner mb-6 animate-pulse overflow-hidden border-4 border-white">
            <span id="celeb-display-emoji" class="text-7xl select-none">🥰</span>
            <img id="celeb-display-image" src="" alt="Custom Celebration" class="w-full h-full object-cover hidden">
        </div>
        <h2 id="display-celeb-title" class="text-3xl sm:text-4xl font-bold text-pink-600 mb-3">
            เย้! วันนี้เป็นวันที่ดีที่สุดเลย! 🎉
        </h2>
        <p id="display-celeb-subtitle" class="text-slate-700 text-lg mb-6 leading-relaxed">
            ขอบคุณที่ตอบตกลงน้า! เธอทำให้ฉันเป็นคนที่โชคดีที่สุดในโลกเลย 💖✨
        </p>
        <p id="display-celeb-message" class="hidden whitespace-pre-line text-slate-700 text-base mb-6 leading-relaxed bg-white/70 rounded-2xl p-4 border border-pink-100 text-left"></p>
        <div id="celeb-gallery" class="hidden grid grid-cols-2 gap-3 mb-6"></div>
        <div class="flex justify-center gap-2 text-3xl mb-4 select-none">
            <span>💖</span><span>🥂</span><span>🌹</span><span>✨</span>
        </div>
        <button onclick="resetPage()" class="mt-4 text-sm text-slate-500 hover:text-slate-700 underline cursor-pointer">
            เล่นอีกครั้ง
        </button>
    </div>

    <!-- Settings Drawer / Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="settings-panel" class="w-full max-w-md bg-white/95 h-full shadow-2xl p-6 overflow-y-auto transform translate-x-full transition-transform duration-300 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-6 border-b pb-4 border-slate-200">
                    <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <span class="text-rose-500" aria-hidden="true">🎛️</span>
                        ปรับแต่งข้อความและรูปภาพ
                    </h3>
                    <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600 p-2 text-xl">
                        <span class="" aria-hidden="true">✕</span>
                    </button>
                </div>

                <!-- Form Controls -->
                <div class="space-y-4 text-left">
                    <!-- Image URL / Emoji Option -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">สติ๊กเกอร์ / รูปภาพหน้าแรก</label>
                        <div class="flex gap-2">
                            <input type="text" id="input-emoji" placeholder="ใส่ Emoji เช่น 🧸" class="w-24 p-2 border border-slate-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-rose-400 focus:outline-none">
                            <input type="url" id="input-image" placeholder="หรือวางลิงก์รูปภาพ (URL)" class="flex-1 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-400 focus:outline-none">
                        </div>
                        <div class="flex items-center gap-2 mt-2">
                            <img id="preview-image" class="hidden w-12 h-12 rounded-full object-cover border border-slate-200" alt="">
                            <label class="cursor-pointer inline-flex items-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-medium px-3 py-2 rounded-lg border border-rose-200 transition">
                                <span class="" aria-hidden="true">🖼️</span> แนบรูปจากเครื่อง
                                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'image')">
                            </label>
                            <button type="button" onclick="clearImage('image')" class="text-xs text-slate-400 hover:text-rose-500 underline">ลบรูป</button>
                        </div>
                        <p class="text-xs text-slate-400 mt-1">* หากมีรูปภาพ ระบบจะแสดงรูปภาพแทน Emoji</p>
                    </div>

                    <!-- Main Title -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">หัวข้อคำถาม</label>
                        <input type="text" id="input-title" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                    </div>

                    <!-- Extra message -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ข้อความเพิ่มเติม (ไม่บังคับ)</label>
                        <textarea id="input-message" rows="3" placeholder="พิมพ์ข้อความยาว ๆ ได้ ขึ้นบรรทัดใหม่ได้" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none"></textarea>
                    </div>

                    <!-- Main Subtitle -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ข้อความย่อย</label>
                        <textarea id="input-subtitle" rows="2" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none"></textarea>
                    </div>

                    <!-- Yes Button Label -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ปุ่มตกลง (Yes)</label>
                        <input type="text" id="input-yes-btn" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                    </div>

                    <hr class="my-4 border-slate-200">

                    <!-- Celebration Settings -->
                    <h4 class="font-bold text-rose-500 text-sm tracking-wide uppercase">ข้อความหลังกดตกลง 🎉</h4>

                    <!-- Celeb Image/Emoji -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">สติ๊กเกอร์ / รูปภาพฉลอง</label>
                        <div class="flex gap-2">
                            <input type="text" id="input-celeb-emoji" placeholder="Emoji" class="w-24 p-2 border border-slate-300 rounded-lg text-center text-lg focus:ring-2 focus:ring-rose-400 focus:outline-none">
                            <input type="url" id="input-celeb-image" placeholder="ลิงก์รูปภาพฉลอง (URL)" class="flex-1 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-400 focus:outline-none">
                        </div>
                        <div class="flex items-center gap-2 mt-2">
                            <img id="preview-celeb-image" class="hidden w-12 h-12 rounded-full object-cover border border-slate-200" alt="">
                            <label class="cursor-pointer inline-flex items-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-medium px-3 py-2 rounded-lg border border-rose-200 transition">
                                <span class="" aria-hidden="true">🖼️</span> แนบรูปจากเครื่อง
                                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, 'celebImage')">
                            </label>
                            <button type="button" onclick="clearImage('celebImage')" class="text-xs text-slate-400 hover:text-rose-500 underline">ลบรูป</button>
                        </div>
                    </div>

                    <!-- Celebration Title -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">หัวข้อหน้าฉลอง</label>
                        <input type="text" id="input-celeb-title" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none">
                    </div>

                    <!-- Celebration Subtitle -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ข้อความย่อยหน้าฉลอง</label>
                        <textarea id="input-celeb-subtitle" rows="2" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none"></textarea>
                    </div>

                    <!-- Celebration extra message -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">จดหมาย / ข้อความเพิ่มเติมหน้าฉลอง (ไม่บังคับ)</label>
                        <textarea id="input-celeb-message" rows="4" placeholder="เขียนข้อความถึงเธอได้เต็มที่เลย" class="w-full p-2 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-rose-400 focus:outline-none"></textarea>
                    </div>

                    <!-- Gallery -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">อัลบั้มรูปหน้าฉลอง (สูงสุด <span id="gallery-max"></span> รูป)</label>
                        <div id="gallery-editor" class="space-y-2 mb-2"></div>
                        <label id="gallery-add-btn" class="cursor-pointer inline-flex items-center gap-2 bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium px-4 py-2 rounded-lg shadow transition">
                            <span class="" aria-hidden="true">＋</span> เพิ่มรูป (เลือกได้หลายรูป)
                            <input type="file" accept="image/*" multiple class="hidden" onchange="handleGalleryUpload(event)">
                        </label>
                        <p id="upload-status" class="text-xs text-slate-400 mt-1"></p>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-200 flex gap-3">
                <button onclick="applySettings()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-4 rounded-xl shadow transition">
                    บันทึกการเปลี่ยนแปลง
                </button>
            </div>
        </div>
    </div>

    <script>
        // Thai messages for the fleeing 'No' button
        const noMessages = [
            "ไม่เอาอ่ะ 😢",
            "แน่ใจเหรอ? 🥺",
            "คิดอีกทีนะ! 💭",
            "กดผิดปุ่มป่าวเนี่ย! 😜",
            "ได้โปรดน้าาา? 🥹",
            "อย่าทำร้ายจิตใจกันสิ! 💔",
            "จับปุ่มนี้ให้ได้ก่อน! 🏃‍♂️",
            "เกือบได้แล้ว! ✨",
            "ยังไม่อีกเหรอ? 😭"
        ];
        let msgIndex = 0;

        // Interactive settings state
        let cardData = {
            emoji: '🧸',
            image: '',
            title: 'เป็นแฟนกันนะ? 💘',
            subtitle: 'เธอทำให้หัวใจของฉันเต้นแรงทุกวันเลยนะ... 🥰',
            yesBtn: 'ตกลงค่ะ! 💖',
            celebEmoji: '🥰',
            celebImage: '',
            celebTitle: 'เย้! วันนี้เป็นวันที่ดีที่สุดเลย! 🎉',
            celebSubtitle: 'ขอบคุณที่ตอบตกลงน้า! เธอทำให้ฉันเป็นคนที่โชคดีที่สุดในโลกเลย 💖✨',
            message: '',
            celebMessage: '',
            gallery: [] // [{ src, caption }]
        };
        const MAX_GALLERY = 6;

        // Load saved data from localStorage if available
        function loadSavedData() {
            try {
                const saved = localStorage.getItem('valentine_card_data');
                if (saved) {
                    cardData = { ...cardData, ...JSON.parse(saved) };
                }
            } catch (e) {
                console.warn('LocalStorage not accessible:', e);
            }
        }

        // Initialize UI from state
        function updateDisplay() {
            // Main card image/emoji
            const displayImg = document.getElementById('display-image');
            const displayEmoji = document.getElementById('display-emoji');
            if (cardData.image && cardData.image.trim() !== '') {
                displayImg.src = cardData.image;
                displayImg.classList.remove('hidden');
                displayEmoji.classList.add('hidden');
            } else {
                displayEmoji.innerText = cardData.emoji || '🧸';
                displayEmoji.classList.remove('hidden');
                displayImg.classList.add('hidden');
            }

            // Main text content
            document.getElementById('display-title').innerText = cardData.title;
            document.getElementById('display-subtitle').innerText = cardData.subtitle;
            document.getElementById('yes-btn').innerText = cardData.yesBtn;
            setOptionalText('display-message', cardData.message);

            // Celebration image/emoji
            const celebImg = document.getElementById('celeb-display-image');
            const celebEmoji = document.getElementById('celeb-display-emoji');
            if (cardData.celebImage && cardData.celebImage.trim() !== '') {
                celebImg.src = cardData.celebImage;
                celebImg.classList.remove('hidden');
                celebEmoji.classList.add('hidden');
            } else {
                celebEmoji.innerText = cardData.celebEmoji || '🥰';
                celebEmoji.classList.remove('hidden');
                celebImg.classList.add('hidden');
            }

            // Celebration text content
            document.getElementById('display-celeb-title').innerText = cardData.celebTitle;
            document.getElementById('display-celeb-subtitle').innerText = cardData.celebSubtitle;
            setOptionalText('display-celeb-message', cardData.celebMessage);
            renderGallery();
        }

        function setOptionalText(id, text) {
            const el = document.getElementById(id);
            if (text && text.trim() !== '') {
                el.textContent = text;
                el.classList.remove('hidden');
            } else {
                el.textContent = '';
                el.classList.add('hidden');
            }
        }

        function renderGallery() {
            const box = document.getElementById('celeb-gallery');
            box.innerHTML = '';
            const items = cardData.gallery || [];
            if (!items.length) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            // one photo -> full width
            box.classList.toggle('grid-cols-1', items.length === 1);
            box.classList.toggle('grid-cols-2', items.length > 1);
            items.forEach(item => {
                const fig = document.createElement('figure');
                fig.className = 'bg-white p-2 pb-3 rounded-xl shadow-md border border-pink-100';
                const img = document.createElement('img');
                img.src = item.src;
                img.alt = item.caption || 'photo';
                img.className = 'w-full aspect-square object-cover rounded-lg';
                fig.appendChild(img);
                if (item.caption && item.caption.trim() !== '') {
                    const cap = document.createElement('figcaption');
                    cap.className = 'text-xs text-slate-600 mt-2 px-1';
                    cap.textContent = item.caption;
                    fig.appendChild(cap);
                }
                box.appendChild(fig);
            });
        }

        // ---------- Image upload helpers ----------
        function fileToDataURL(file, maxSize = 800, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = e => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function setStatus(msg) {
            document.getElementById('upload-status').textContent = msg || '';
        }

        async function handleImageUpload(event, key) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            try {
                cardData[key] = await fileToDataURL(file, 600);
                // clear URL box so the uploaded file takes priority
                document.getElementById(key === 'image' ? 'input-image' : 'input-celeb-image').value = '';
                updatePreviews();
            } catch (e) {
                alert('ไม่สามารถอ่านไฟล์รูปภาพนี้ได้ 😢');
            }
        }

        function clearImage(key) {
            cardData[key] = '';
            document.getElementById(key === 'image' ? 'input-image' : 'input-celeb-image').value = '';
            updatePreviews();
        }

        function updatePreviews() {
            [['image', 'preview-image'], ['celebImage', 'preview-celeb-image']].forEach(([key, id]) => {
                const el = document.getElementById(id);
                if (cardData[key]) { el.src = cardData[key]; el.classList.remove('hidden'); }
                else { el.removeAttribute('src'); el.classList.add('hidden'); }
            });
        }

        async function handleGalleryUpload(event) {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            if (!files.length) return;
            cardData.gallery = cardData.gallery || [];
            const room = MAX_GALLERY - cardData.gallery.length;
            if (room <= 0) { setStatus('ครบ ' + MAX_GALLERY + ' รูปแล้ว ลบรูปเดิมก่อนนะ'); return; }
            setStatus('กำลังประมวลผลรูป...');
            for (const file of files.slice(0, room)) {
                try {
                    cardData.gallery.push({ src: await fileToDataURL(file, 800), caption: '' });
                } catch (e) { /* skip unreadable file */ }
            }
            setStatus(files.length > room ? 'เพิ่มได้ไม่เกิน ' + MAX_GALLERY + ' รูป' : '');
            renderGalleryEditor();
        }

        function removeGalleryItem(i) {
            cardData.gallery.splice(i, 1);
            renderGalleryEditor();
        }

        function renderGalleryEditor() {
            const box = document.getElementById('gallery-editor');
            box.innerHTML = '';
            (cardData.gallery || []).forEach((item, i) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200';
                const img = document.createElement('img');
                img.src = item.src;
                img.className = 'w-14 h-14 object-cover rounded-md';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'คำบรรยายใต้รูป (ไม่บังคับ)';
                input.value = item.caption || '';
                input.className = 'flex-1 p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-rose-400 focus:outline-none';
                input.oninput = () => { cardData.gallery[i].caption = input.value; };
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'text-slate-400 hover:text-rose-500 p-2';
                del.innerHTML = '<span class="" aria-hidden="true">🗑️</span>';
                del.onclick = () => removeGalleryItem(i);
                row.append(img, input, del);
                box.appendChild(row);
            });
            document.getElementById('gallery-add-btn').classList.toggle('hidden', (cardData.gallery || []).length >= MAX_GALLERY);
        }

        function populateForm() {
            document.getElementById('input-emoji').value = cardData.emoji || '';
            document.getElementById('input-image').value = (cardData.image || '').startsWith('data:') ? '' : (cardData.image || '');
            document.getElementById('input-message').value = cardData.message || '';
            document.getElementById('input-title').value = cardData.title || '';
            document.getElementById('input-subtitle').value = cardData.subtitle || '';
            document.getElementById('input-yes-btn').value = cardData.yesBtn || '';
            document.getElementById('input-celeb-emoji').value = cardData.celebEmoji || '';
            document.getElementById('input-celeb-image').value = (cardData.celebImage || '').startsWith('data:') ? '' : (cardData.celebImage || '');
            document.getElementById('input-celeb-message').value = cardData.celebMessage || '';
            document.getElementById('gallery-max').textContent = MAX_GALLERY;
            setStatus('');
            updatePreviews();
            renderGalleryEditor();
            document.getElementById('input-celeb-title').value = cardData.celebTitle || '';
            document.getElementById('input-celeb-subtitle').value = cardData.celebSubtitle || '';
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const panel = document.getElementById('settings-panel');
            
            if (modal.classList.contains('pointer-events-none')) {
                populateForm();
                modal.classList.remove('pointer-events-none', 'opacity-0');
                modal.classList.add('opacity-100');
                panel.classList.remove('translate-x-full');
            } else {
                modal.classList.add('pointer-events-none', 'opacity-0');
                modal.classList.remove('opacity-100');
                panel.classList.add('translate-x-full');
            }
        }

        function applySettings() {
            cardData.emoji = document.getElementById('input-emoji').value;
            const urlMain = document.getElementById('input-image').value.trim();
            if (urlMain) cardData.image = urlMain;
            else if (!(cardData.image || '').startsWith('data:')) cardData.image = '';
            cardData.message = document.getElementById('input-message').value;
            cardData.title = document.getElementById('input-title').value;
            cardData.subtitle = document.getElementById('input-subtitle').value;
            cardData.yesBtn = document.getElementById('input-yes-btn').value;
            cardData.celebEmoji = document.getElementById('input-celeb-emoji').value;
            const urlCeleb = document.getElementById('input-celeb-image').value.trim();
            if (urlCeleb) cardData.celebImage = urlCeleb;
            else if (!(cardData.celebImage || '').startsWith('data:')) cardData.celebImage = '';
            cardData.celebMessage = document.getElementById('input-celeb-message').value;
            cardData.celebTitle = document.getElementById('input-celeb-title').value;
            cardData.celebSubtitle = document.getElementById('input-celeb-subtitle').value;

            // Save to localStorage for persistence
            try {
                localStorage.setItem('valentine_card_data', JSON.stringify(cardData));
            } catch (e) {
                console.warn('Failed to save to localStorage:', e);
                alert('บันทึกถาวรไม่สำเร็จ (รูปอาจมีขนาดรวมใหญ่เกินไป) ลองลดจำนวนรูปดูนะ — การ์ดยังแสดงผลได้ในหน้านี้');
            }

            updateDisplay();
            toggleSettingsModal();
        }

        function moveNoButton() {
            const noBtn = document.getElementById('no-btn');
            
            // Cycle through Thai funny escape texts
            msgIndex = (msgIndex + 1) % noMessages.length;
            noBtn.innerText = noMessages[msgIndex];

            // Random position inside screen viewport
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function handleYesClick() {
            const mainCard = document.getElementById('main-card');
            mainCard.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                mainCard.classList.add('hidden');
                
                const celebScreen = document.getElementById('celebration-screen');
                celebScreen.classList.remove('hidden');
                setTimeout(() => {
                    celebScreen.classList.remove('scale-95', 'opacity-0');
                    celebScreen.classList.add('scale-100', 'opacity-100');
                }, 50);
            }, 300);

            triggerConfetti();
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff69b4', '#ff1493', '#ffc0cb', '#ff4500']
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff69b4', '#ff1493', '#ffc0cb', '#ff4500']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Generate ambient floating hearts in background
        function createBgHeart() {
            const bgHearts = document.getElementById('bg-hearts');
            if (!bgHearts) return;

            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = Math.random() > 0.5 ? '💖' : '✨';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = (window.innerHeight + 50) + 'px';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            
            const duration = Math.random() * 3 + 3;
            heart.style.animationDuration = duration + 's';

            bgHearts.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createBgHeart, 400);

        function resetPage() {
            location.reload();
        }

        // Initialize display on startup
        window.onload = function() {
            loadSavedData();
            updateDisplay();
        };
    </script>
</body>
</html>
